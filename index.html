<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Taxi Pay Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --primary-yellow: #fcc419;
  --bg-gray: #f8f9fa;
  --text-dark: #333;
  --seat-red: #ff4d4d;
  --seat-green: #2ecc71;
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-gray);
  color: var(--text-dark);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  background: #fff;
}
.back-btn { font-size: 20px; cursor: pointer; }
.header-title { font-weight: bold; font-size: 18px; }

/* Page Containers */
.page {
  display: none;
  flex: 1;
  padding: 20px;
  flex-direction: column;
  align-items: center;
}
.page.active { display: flex; }

/* --- PAGE 1: ENTRY --- */
.welcome-card {
  background: white;
  width: 90%;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  margin-top: 20px;
}
.welcome-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
.name-highlight { color: var(--primary-yellow); }
.instruction { color: #666; line-height: 1.5; margin-bottom: 20px; }

.input-label { align-self: flex-start; margin-left: 10%; font-size: 14px; color: #888; margin-top: 20px; }
.code-input {
  width: 80%;
  padding: 15px;
  font-size: 24px;
  text-align: center;
  letter-spacing: 8px;
  border: 1px solid #ddd;
  border-radius: 12px;
  margin-top: 10px;
  outline: none;
}
.join-btn {
  width: 85%;
  background: var(--primary-yellow);
  border: none;
  padding: 18px;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 25px;
  cursor: pointer;
}

/* --- PAGE 2: SEAT SELECTION --- */
.taxi-container {
  background: #fff;
  border: 3px solid #666;
  border-radius: 40px 40px 10px 10px;
  width: 280px;
  padding: 20px;
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 10px;
}

.seat {
  width: 45px;
  height: 45px;
  background-color: var(--seat-red);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  cursor: pointer;
  position: relative;
}
.seat::after { /* Seat headrest look */
  content: '';
  position: absolute;
  top: -5px;
  width: 25px;
  height: 8px;
  background: inherit;
  border-radius: 4px;
}

.seat.driver { background: #3498db; cursor: default; }
.seat.selected { background: var(--seat-green); transform: scale(1.1); }

/* Layout Grid Specifics */
.door-space {
  grid-column: 3 / 5;
  grid-row: 3 / 5;
  border: 2px dashed #ccc;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-weight: bold;
  font-size: 12px;
}

.footer-btn {
  position: fixed;
  bottom: 20px;
  width: 90%;
  background: #ff4d4d;
  color: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  left: 5%;
}

</style>
</head>
<body>

<div class="header">
  <div class="back-btn" onclick="goBack()">←</div>
  <div class="header-title">Taxi pay</div>
  <div style="font-size: 20px;">✕</div>
</div>

<div class="page active" id="page1">
  <div class="welcome-card">
    <div class="welcome-text">ሰላም, <span id="user-name" class="name-highlight">USER</span> 👋</div>
    <p class="instruction">እንኳን ደህና መጡ! አሁን ከዚህ በታች ያለውን የአሽከርካሪ ኮድ በመጠቀም ታክሲ መቀላቀል ይችላሉ:: 👇</p>
  </div>
  
  <div class="input-label">የአሽከርካሪ ኮድ ያስገቡ</div>
  <input type="text" id="taxiCode" class="code-input" placeholder="000000" maxlength="6" inputmode="numeric">
  
  <button class="join-btn" onclick="validateAndGo()">ጉዞ ይቀላቀሉ</button>
</div>

<div class="page" id="page2">
  <div class="taxi-container">
    <div class="seat driver">🚗</div>
    <div></div> <div class="seat" data-num="2">2</div>
    <div class="seat" data-num="1">1</div>

    <div class="seat" data-num="3">3</div>
    <div class="seat" data-num="4">4</div>
    <div></div><div></div>

    <div class="seat" data-num="5">5</div>
    <div class="seat" data-num="6">6</div>
    <div class="door-space">Door</div>

    <div class="seat" data-num="7">7</div>
    <div class="seat" data-num="8">8</div>

    <div class="seat" data-num="9">9</div>
    <div class="seat" data-num="10">10</div>
    <div class="seat" data-num="11">11</div>
    <div class="seat" data-num="12">12</div>
  </div>

  <div class="footer-btn" onclick="confirmSeat()">ጉዞ ውጡ</div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Set Telegram Username
  const username = tg.initDataUnsafe?.user?.first_name || "Guest";
  document.getElementById('user-name').innerText = username.toUpperCase();

  function validateAndGo() {
    const code = document.getElementById('taxiCode').value;
    if(code.length === 6) {
      document.getElementById('page1').classList.remove('active');
      document.getElementById('page2').classList.add('active');
      tg.HapticFeedback.notificationOccurred('success');
    } else {
      tg.showAlert("እባክዎ ትክክለኛ 6 አሃዝ ኮድ ያስገቡ");
    }
  }

  function goBack() {
    document.getElementById('page2').classList.remove('active');
    document.getElementById('page1').classList.add('active');
  }

  // Seat Selection Logic
  document.querySelectorAll('.seat:not(.driver)').forEach(seat => {
    seat.addEventListener('click', () => {
      // Unselect others
      document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
      // Select current
      seat.classList.add('selected');
      tg.HapticFeedback.impactOccurred('medium');
    });
  });

  function confirmSeat() {
    const selected = document.querySelector('.seat.selected');
    if(selected) {
      tg.showConfirm(`Seat ${selected.dataset.num} confirm?`, (ok) => {
        if(ok) tg.close();
      });
    } else {
      tg.showAlert("እባክዎ መጀመሪያ ወንበር ይምረጡ");
    }
  }
</script>

</body>
</html>
