<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Pay – Lekfel</title>

<style>
:root{
  --yellow:#FFC533;
  --dark:#1f2937;
  --gray:#6b7280;
  --light:#f3f4f6;
  --card:#ffffff;
}

*{
  box-sizing:border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body{
  margin:0;
  background:#fff;
  color:#111;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid #eee;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}

.icon{
  font-size:18px;
}

/* CONTENT */
.container{
  padding:16px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:14px;
  padding:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  margin-bottom:22px;
}

.card h3{
  margin:0 0 8px 0;
  font-size:20px;
}

.card p{
  margin:0;
  color:#374151;
  line-height:1.6;
}

/* INPUT */
.label{
  font-size:14px;
  color:#374151;
  margin-bottom:6px;
}

.input-row{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:14px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

.qr{
  width:48px;
  height:48px;
  border-radius:10px;
  border:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* BUTTON */
button{
  width:100%;
  background:var(--yellow);
  border:none;
  border-radius:14px;
  padding:16px;
  font-size:18px;
  font-weight:600;
  margin-top:16px;
  cursor:pointer;
}

/* LINK */
.link{
  margin-top:18px;
  text-align:center;
  color:#374151;
  font-size:14px;
  text-decoration:underline;
}

/* ===== TAXI SEAT SCREEN ===== */
.taxi-screen{
  background:#fbbf24;
  padding:20px;
}

.phone{
  background:#fff;
  border-radius:26px;
  padding:12px;
  max-width:360px;
  margin:auto;
}

.phone-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 4px;
  font-weight:600;
}

.taxi{
  background:#e5e7eb;
  border-radius:16px;
  padding:12px;
  margin-top:10px;
}

.seats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.seat{
  background:#ef4444;
  color:#fff;
  border-radius:10px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.seat.free{
  background:#3b82f6;
}

.driver{
  grid-column:1/3;
  background:#9ca3af;
}

/* SMALL POLISH */
.center{
  text-align:center;
}
</style>
</head>

<body>

<!-- JOIN TAXI SCREEN -->
<div class="header">
  <div class="header-left">
    <span class="icon">←</span>
    <span>Join a Taxi</span>
  </div>
  <span class="icon">☰</span>
</div>

<div class="container">

  <div class="card">
    <h3>ሰላም, <span style="color:#f59e0b">OMER</span> 👋</h3>
    <p>
      እባክዎ የታክሲ መቀመጫ ኮድ ያስገቡ፤ ወይም QR ኮድ ይስካኑ። 👇
    </p>
  </div>

  <div class="label">የታክሲ ኮድ</div>
  <div class="input-row">
    <input placeholder="000000" maxlength="6">
    <div class="qr">▣</div>
  </div>

  <button>ግባ ወደ ታክሲ</button>

  <div class="link">ኮድ የለዎትም? ታክሲ ፈልግ</div>

</div>

<!-- TAXI PAY SEAT SCREEN -->
<div class="taxi-screen">
  <div class="phone">

    <div class="phone-header">
      <span>Taxi pay</span>
      <span>✕</span>
    </div>

    <div class="center" style="font-size:14px;color:#374151;">
      Megenagna → 22 <br>
      <strong>10 ETB</strong>
    </div>

    <div class="taxi">
      <div class="seats">
        <div class="seat driver">Driver</div>
        <div class="seat">1</div>
        <div class="seat">2</div>
        <div class="seat">3</div>
        <div class="seat">4</div>
        <div class="seat">5</div>
        <div class="seat">6</div>
        <div class="seat">7</div>
        <div class="seat">8</div>
        <div class="seat">9</div>
        <div class="seat">10</div>
        <div class="seat">11</div>
        <div class="seat">12</div>
      </div>
    </div>

  </div>
</div>
