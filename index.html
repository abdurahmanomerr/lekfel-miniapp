<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Taxi Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:#f9fafb;
}

/* ---------- PAGE HANDLING ---------- */
.page{ display:none; padding:16px; }
.page.active{ display:block; }

/* ---------- PAGE 1 ---------- */
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:14px;
  font-size:18px;
  text-align:center;
  letter-spacing:6px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:12px;
}

button{
  width:100%;
  padding:16px;
  margin-top:16px;
  border:none;
  border-radius:14px;
  background:#fbbf24;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}

/* ---------- TAXI ---------- */
.taxi-wrapper{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.taxi{
  background:#e5e7eb;
  border-radius:28px;
  padding:16px;
  width:320px;
}

/* FRONT */
.front{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

/* MIDDLE */
.middle{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

/* BACK */
.back{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

/* SEAT */
.seat{
  height:48px;
  border-radius:10px;
  background:#ef4444;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.seat.driver{
  background:#6b7280;
  cursor:default;
}

.seat.selected{
  background:#22c55e;
}

/* TITLE */
.title{
  font-size:20px;
  font-weight:700;
}
.sub{
  color:#6b7280;
  margin-top:4px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <div class="card">
    <div class="title">ሰላም, <span id="username">👋</span></div>
    <div class="sub">Enter 6-digit taxi code</div>

    <input id="codeInput" maxlength="6" placeholder="000000" />

    <button onclick="goToSeats()">Join Taxi</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <div class="title">Select Your Seat</div>
  <div class="sub">Tap any available seat</div>

  <div class="taxi-wrapper">
    <div class="taxi">

      <!-- FRONT -->
      <div class="front">
        <div class="seat driver">🚗</div>
        <div class="seat" data-seat="1">1</div>
        <div class="seat" data-seat="2">2</div>
      </div>

      <!-- MIDDLE -->
      <div class="middle">
        <div class="seat" data-seat="3">3</div>
        <div class="seat" data-seat="4">4</div>
        <div class="seat" data-seat="5">5</div>

        <div class="seat" data-seat="6">6</div>
        <div class="seat" data-seat="7">7</div>
        <div class="seat" data-seat="8">8</div>
      </div>

      <!-- BACK -->
      <div class="back">
        <div class="seat" data-seat="9">9</div>
        <div class="seat" data-seat="10">10</div>
        <div class="seat" data-seat="11">11</div>
        <div class="seat" data-seat="12">12</div>
      </div>

    </div>
  </div>
</div>

<script>
/* ---------- TELEGRAM USER ---------- */
const tg = window.Telegram.WebApp;
tg.ready();

const user = tg.initDataUnsafe?.user;
document.getElementById("username").innerText =
  user?.first_name || "Guest";

/* ---------- PAGE SWITCH ---------- */
function goToSeats(){
  const code = document.getElementById("codeInput").value;
  if(code.length === 6){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
  }else{
    alert("Enter 6-digit code");
  }
}

/* ---------- SEAT CLICK ---------- */
document.querySelectorAll(".seat:not(.driver)").forEach(seat=>{
  seat.onclick = () => {
    document.querySelectorAll(".seat").forEach(s=>s.classList.remove("selected"));
    seat.classList.add("selected");

    tg.HapticFeedback.impactOccurred("light");
  };
});
</script>

</body>
</html>
